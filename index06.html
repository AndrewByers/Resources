<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Dashboard</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #e2e8f0;
            --danger: #dc2626;
            --success: #16a34a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .client-filter-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .client-filter-container select {
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.9rem;
            background: var(--bg-color);
            color: var(--text-main);
            cursor: pointer;
        }

        .menu-container {
            position: relative;
        }

        .menu-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .menu-btn:hover {
            background-color: var(--primary-hover);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: var(--card-bg);
            min-width: 180px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-radius: 6px;
            border: 1px solid var(--border);
            z-index: 10;
            overflow: hidden;
        }

        .dropdown-content button {
            color: var(--text-main);
            padding: 12px 16px;
            text-align: left;
            background: none;
            border: none;
            width: 100%;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .dropdown-content button:hover {
            background-color: var(--bg-color);
        }

        .show {
            display: block;
        }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .project-tile {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-left: 6px solid var(--client-color, var(--border));
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
        }

        .project-tile:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .project-tile h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .project-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        .form-group textarea {
            resize: vertical;
            height: 80px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-main);
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }
        
        .loading {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Active Projects</h1>
        <div class="header-controls">
            <div class="client-filter-container">
                <label for="clientFilterSelect">Client:</label>
                <select id="clientFilterSelect" onchange="onClientFilterChange()">
                    <option value="ALL">All</option>
                </select>
            </div>
            <div class="menu-container">
                <button class="menu-btn" onclick="toggleMenu()">Menu ▾</button>
                <div id="dropdownMenu" class="dropdown-content">
                    <button onclick="openNewProjectModal()">Add New Project</button>
                    <button onclick="openEditSelectModal()">Edit Project</button>
                    <button onclick="openCompleteSelectModal()">Mark as Completed</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div id="projectGrid" class="grid">
            <div class="loading">Loading projects from Google Sheet...</div>
        </div>
    </main>

    <!-- Generic Modal for Forms/Details -->
    <div id="appModal" class="modal">
        <div class="modal-content" id="modalBody">
            <!-- Dynamically injected content -->
        </div>
    </div>

    <script>
        // CONFIGURATION: Paste your deployed Google Apps Script Web App URL below
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwl2m6giC5v--SJjbEDQnembOZNGkeCPguQ0G73clUwhigckGU4Cw3o1zDAMxv04260nw/exec";

        let projects = [];
        let selectedClientFilter = "ALL";

        // Distinct, aesthetically pleasing color palette for clients
        const COLOR_PALETTE = [
            '#2563eb', // Royal Blue
            '#16a34a', // Emerald Green
            '#9333ea', // Purple
            '#ea580c', // Orange
            '#0d9488', // Teal
            '#db2777', // Pink
            '#ca8a04', // Amber
            '#4f46e5', // Indigo
            '#0284c7', // Sky Blue
            '#65a30d'  // Lime
        ];

        let clientColorMap = {};

        // Fetch projects on load
        window.addEventListener('DOMContentLoaded', fetchProjects);

        function toggleMenu() {
            document.getElementById("dropdownMenu").classList.toggle("show");
        }

        window.onclick = function(event) {
            if (!event.target.matches('.menu-btn')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        async function fetchProjects() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                projects = data;
                buildClientColorMapping();
                updateClientDropdownOptions();
                renderGrid();
            } catch (error) {
                console.error('Error fetching projects:', error);
                document.getElementById('projectGrid').innerHTML = `<div class="loading">Error loading projects. Check your Script URL configuration.</div>`;
            }
        }

        function buildClientColorMapping() {
            const activeProjects = projects.filter(p => p.Status && p.Status.toLowerCase() !== 'completed');
            const clients = [...new Set(activeProjects.map(p => p.Client).filter(Boolean))].sort();
            
            clientColorMap = {};
            clients.forEach((client, index) => {
                clientColorMap[client] = COLOR_PALETTE[index % COLOR_PALETTE.length];
            });
        }

        function updateClientDropdownOptions() {
            const selectEl = document.getElementById('clientFilterSelect');
            const activeProjects = projects.filter(p => p.Status && p.Status.toLowerCase() !== 'completed');
            const clients = [...new Set(activeProjects.map(p => p.Client).filter(Boolean))].sort();

            let optionsHtml = `<option value="ALL">All</option>`;
            clients.forEach(client => {
                const selectedAttr = (client === selectedClientFilter) ? 'selected' : '';
                optionsHtml += `<option value="${escapeHtml(client)}" ${selectedAttr}>${escapeHtml(client)}</option>`;
            });
            selectEl.innerHTML = optionsHtml;
        }

        function onClientFilterChange() {
            const selectEl = document.getElementById('clientFilterSelect');
            selectedClientFilter = selectEl.value;
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('projectGrid');
            
            // Filter out completed projects
            let activeProjects = projects.filter(p => p.Status && p.Status.toLowerCase() !== 'completed');

            // Apply client filter if selected
            if (selectedClientFilter !== "ALL") {
                activeProjects = activeProjects.filter(p => p.Client === selectedClientFilter);
            }

            if (activeProjects.length === 0) {
                grid.innerHTML = `<div class="loading">No active projects found.</div>`;
                return;
            }

            // Sort by Priority (ascending: 1 first) then by earliest DueDate
            activeProjects.sort((a, b) => {
                let pA = parseInt(a.Priority) || 3;
                let pB = parseInt(b.Priority) || 3;
                if (pA !== pB) {
                    return pA - pB;
                }
                let dateA = a.DueDate ? new Date(a.DueDate).getTime() : 0;
                let dateB = b.DueDate ? new Date(b.DueDate).getTime() : 0;
                return dateA - dateB;
            });

            grid.innerHTML = '';
            activeProjects.forEach(proj => {
                const tile = document.createElement('div');
                tile.className = 'project-tile';
                
                // Assign persistent client-specific accent color
                const clientName = proj.Client || 'N/A';
                const clientColor = clientColorMap[clientName] || '#2563eb';
                tile.style.setProperty('--client-color', clientColor);

                tile.onclick = () => showProjectDetails(proj.ID);
                
                const priorityVal = escapeHtml(String(proj.Priority || '3'));
                const formattedDate = formatDateUK(proj.DueDate);

                tile.innerHTML = `
                    <div>
                        <h3>${escapeHtml(proj.Description || 'Untitled Project')}</h3>
                        <div class="project-meta">For: ${escapeHtml(clientName)}</div>
                    </div>
                    <div class="project-meta" style="margin-top: 15px;">Priority: ${priorityVal} | Due: ${formattedDate}</div>
                `;
                grid.appendChild(tile);
            });
        }

        function formatDateUK(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return escapeHtml(dateString);
            
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = String(date.getFullYear()).slice(-2);
            return `${day}-${month}-${year}`;
        }

        function showProjectDetails(id) {
            const proj = projects.find(p => p.ID === id);
            if (!proj) return;

            const modal = document.getElementById('appModal');
            const body = document.getElementById('modalBody');

            body.innerHTML = `
                <h2>Project Details</h2>
                <p><strong>Who is it for:</strong> ${escapeHtml(proj.Client)}</p>
                <p><strong>Description:</strong> ${escapeHtml(proj.Description)}</p>
                <p><strong>Outcome:</strong> ${escapeHtml(proj.Outcome)}</p>
                <p><strong>First Action:</strong> ${escapeHtml(proj.FirstAction)}</p>
                <p><strong>Next 3 Actions:</strong><br>${escapeHtml(proj.NextActions).replace(/\n/g, '<br>')}</p>
                <p><strong>Notes:</strong><br>${proj.Notes ? escapeHtml(proj.Notes).replace(/\n/g, '<br>') : '<em>None</em>'}</p>
                <p><strong>Due Date:</strong> ${formatDateUK(proj.DueDate)}</p>
                <p><strong>Priority:</strong> ${escapeHtml(String(proj.Priority))}</p>
                <div class="modal-actions">
                    <button class="btn-secondary" onclick="closeModal()">Close</button>
                </div>
            `;
            modal.style.display = 'flex';
        }

        function openNewProjectModal(existingData = null, isEdit = false) {
            const modal = document.getElementById('appModal');
            const body = document.getElementById('modalBody');

            let formattedInputDate = '';
            if (existingData && existingData.DueDate) {
                const d = new Date(existingData.DueDate);
                if (!isNaN(d.getTime())) {
                    formattedInputDate = d.toISOString().split('T')[0];
                } else {
                    formattedInputDate = existingData.DueDate;
                }
            }

            body.innerHTML = `
                <h2>${isEdit ? 'Edit Project' : 'Add New Project'}</h2>
                <form id="projectForm" onsubmit="handleFormSubmit(event, ${isEdit})">
                    ${isEdit ? `<input type="hidden" name="ID" value="${existingData.ID}">` : ''}
                    <div class="form-group">
                        <label>Who is it for?</label>
                        <input type="text" name="Client" value="${existingData ? escapeHtml(existingData.Client) : ''}" required>
                    </div>
                    <div class="form-group">
                        <label>What is the best description for this project?</label>
                        <textarea name="Description" required>${existingData ? escapeHtml(existingData.Description) : ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>What is the outcome you hope to get?</label>
                        <textarea name="Outcome" required>${existingData ? escapeHtml(existingData.Outcome) : ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>What is the first action that is needed?</label>
                        <input type="text" name="FirstAction" value="${existingData ? escapeHtml(existingData.FirstAction) : ''}" required>
                    </div>
                    <div class="form-group">
                        <label>What are the next 3 actions?</label>
                        <textarea name="NextActions" required>${existingData ? escapeHtml(existingData.NextActions) : ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Notes / Free Text:</label>
                        <textarea name="Notes">${existingData ? escapeHtml(existingData.Notes) : ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>When does this need to be done by?</label>
                        <input type="date" name="DueDate" value="${formattedInputDate}" required>
                    </div>
                    <div class="form-group">
                        <label>What priority would you give it (1-Now, 3-Whenever)?</label>
                        <select name="Priority">
                            <option value="1" ${existingData && existingData.Priority == 1 ? 'selected' : ''}>1 - Now</option>
                            <option value="2" ${existingData && existingData.Priority == 2 ? 'selected' : ''}>2 - Soon</option>
                            <option value="3" ${existingData && existingData.Priority == 3 ? 'selected' : ''}>3 - Whenever</option>
                        </select>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn-primary">Save Project</button>
                    </div>
                </form>
            `;
            modal.style.display = 'flex';
        }

        async function handleFormSubmit(event, isEdit) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            data.action = isEdit ? 'edit' : 'add';
            if (!isEdit) {
                data.Status = 'Active';
            }

            const actionsDiv = form.querySelector('.modal-actions');
            actionsDiv.innerHTML = '<span>Saving...</span>';

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                closeModal();
                setTimeout(fetchProjects, 1500);
            } catch (error) {
                console.error('Error saving project:', error);
                alert('Error saving project.');
                closeModal();
            }
        }

        function openEditSelectModal() {
            const activeProjects = projects.filter(p => p.Status && p.Status.toLowerCase() !== 'completed');
            if (activeProjects.length === 0) {
                alert('No active projects to edit.');
                return;
            }
            showSelectorModal('Select Project to Edit', activeProjects, (id) => {
                const proj = projects.find(p => p.ID === id);
                openNewProjectModal(proj, true);
            });
        }

        function openCompleteSelectModal() {
            const activeProjects = projects.filter(p => p.Status && p.Status.toLowerCase() !== 'completed');
            if (activeProjects.length === 0) {
                alert('No active projects to mark as completed.');
                return;
            }
            showSelectorModal('Mark Project as Completed', activeProjects, async (id) => {
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'complete', ID: id })
                    });
                    closeModal();
                    setTimeout(fetchProjects, 1500);
                } catch (error) {
                    console.error('Error completing project:', error);
                    alert('Error updating project status.');
                }
            });
        }

        function showSelectorModal(title, list, callback) {
            const modal = document.getElementById('appModal');
            const body = document.getElementById('modalBody');

            let optionsHtml = list.map(p => `<option value="${p.ID}">${escapeHtml(p.Description)} (${escapeHtml(p.Client)})</option>`).join('');

            body.innerHTML = `
                <h2>${title}</h2>
                <div class="form-group">
                    <label>Choose a project:</label>
                    <select id="selectedProjId">${optionsHtml}</select>
                </div>
                <div class="modal-actions">
                    <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn-primary" onclick="executeSelection()">Proceed</button>
                </div>
            `;
            modal.style.display = 'flex';
            window.tempCallback = callback;
        }

        function executeSelection() {
            const id = document.getElementById('selectedProjId').value;
            if (window.tempCallback) window.tempCallback(id);
        }

        function closeModal() {
            document.getElementById('appModal').style.display = 'none';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
